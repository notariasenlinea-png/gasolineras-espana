name: Actualización Diaria Precios Gasolineras España

on:
  # Desactivado cron automático para evitar spam de correos mientras no haya token en GitHub Secrets.
  # Se puede ejecutar manualmente con el botón 'Run workflow' desde GitHub Actions.
  workflow_dispatch:

jobs:
  update-and-deploy:
    name: Descarga MITECO + Compilación Astro + Deploy Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Descargar código fuente del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Ejecutar ETL de Precios Oficiales (MITECO)
        run: |
          python scripts/fetch_gasolineras.py

      - name: 4. Configurar entorno Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 5. Instalar dependencias del proyecto
        run: |
          npm ci --legacy-peer-deps

      - name: 6. Compilar portal estático (Astro Build)
        run: |
          npm run build

      - name: 7. Desplegar en vivo a Cloudflare Pages
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=gasolineras-espana --branch=main --commit-dirty=true
